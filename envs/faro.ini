; =============================================================================
; envs/faro.ini — Faro PlatformIO environments
;
; This file is symlinked by scripts/link_env.sh to:
;     external/MeshCore/platformio.local.ini
; Upstream's root platformio.ini loads platformio.local.ini via extra_configs and
; git-ignores it, so we can `extends` upstream sections with ZERO MeshCore changes.
; Public builds use the unmodified upstream MeshCore pinned in external/MeshCore.
;
; Build:   pio run -d external/MeshCore -e faro_tdeck
; Paths:   -I / lib paths are relative to external/MeshCore (the PlatformIO project);
;          build_src_filter paths are relative to external/MeshCore/src.
; =============================================================================

[platformio]
; Extra env files kept outside this repository (git-ignored envs.local/).
; PlatformIO reads extra_configs recursively; an empty glob changes nothing.
extra_configs = ../../envs.local/*.ini

[faro_common]
build_unflags =
  -std=gnu++11
build_flags =
  -std=gnu++17
  ; our UITask.h must be found by upstream main.cpp's  #include "UITask.h"
  -I src
  -I ../../app/ui
  -I ../../app
  ; upstream companion headers (AbstractUITask.h, MyMesh.h, NodePrefs.h, DataStore.h)
  -I examples/companion_radio
  ; LVGL config lives in app/config/lv_conf.h
  -D LV_CONF_INCLUDE_SIMPLE
  -D LV_LVGL_H_INCLUDE_SIMPLE
  -I ../../app/config
  ; display override (ADR-008): FaroDisplay implements upstream DisplayDriver.
  ; FaroDisplay.h is force-included into EVERY TU (incl. libraries): keep it __has_include-guarded,
  ; free of third-party includes (pimpl). Do NOT use -U (PlatformIO mangles it); last -D wins.
  -D DISPLAY_CLASS=FaroDisplay
  -I ../../app/hal
  -include FaroDisplay.h
  -D FARO_PRODUCT_NAME=\"Faro\"
  -D FARO_VERSION=\"0.9.1\"
  -D ENV_SKIP_GPS_DETECT=1
  ; first-boot radio = Types.h kRadioPresets[0] (EU/CH Narrow), not upstream's 915 MHz default
  -D LORA_FREQ=869.618
  -D LORA_BW=62.5
  -D LORA_SF=8
  -D LORA_CR=8
  -D ARDUINO_LOOP_STACK_SIZE=16384
  ; Companion-protocol key import/export stays OFF (upstream default): with it, any client on
  ; the unauthenticated TCP port could read or replace the node key. On-device SD backup only.
lib_deps =
  lvgl/lvgl @ 9.3.0


; -----------------------------------------------------------------------------
; Faro — T-Deck / T-Deck Plus
; Built on unmodified upstream MeshCore.
; -----------------------------------------------------------------------------
[env:faro_tdeck]
extends = LilyGo_TDeck
build_unflags =
  ${faro_common.build_unflags}
  ; the SX1262 shares SCLK/MISO/MOSI with the TFT and the SD card: without P_LORA_SCLK the radio uses the
  ; global FSPI `SPI` (begun on those pins by the display) instead of its own HSPI instance; two SPI
  ; peripherals on one set of GPIOs leave the pins to whichever attached last (the radio went deaf)
  -D P_LORA_SCLK=40
build_flags =
  ${LilyGo_TDeck.build_flags}
  ${faro_common.build_flags}
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D OFFLINE_QUEUE_SIZE=256
  -D ENABLE_WIFI_INTERFACE
  -D PIN_BOARD_SDA=18
  -D PIN_BOARD_SCL=8
build_src_filter =
  ${LilyGo_TDeck.build_src_filter}
  +<helpers/esp32/*.cpp>
  +<helpers/wifi/*.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<../examples/companion_radio/*.cpp>
  ; NOTE: no ui-new here — our app/ui/UITask.cpp replaces it
  +<../../../app/>
extra_scripts =
  pre:../../scripts/pio_env_stamp.py
  ${LilyGo_TDeck.extra_scripts}
lib_deps =
  ${LilyGo_TDeck.lib_deps}
  densaugeo/base64 @ 1.4.0
  ${faro_common.lib_deps}

; -----------------------------------------------------------------------------
; Faro — Heltec V3 Headless Gateway
; Built on unmodified upstream MeshCore.
; -----------------------------------------------------------------------------
[env:faro_heltec_v3]
extends = Heltec_lora32_v3
build_unflags =
  ${faro_common.build_unflags}
build_flags =
  ${Heltec_lora32_v3.build_flags}
  ${faro_common.build_flags}
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D OFFLINE_QUEUE_SIZE=256
  -D ENABLE_WIFI_INTERFACE
  -D FARO_HEADLESS=1
build_src_filter =
  ${Heltec_lora32_v3.build_src_filter}
  +<helpers/esp32/*.cpp>
  +<helpers/wifi/*.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../../../app/core/>
  +<../../../app/hal/>
  +<../../../app/platform/>
  +<../../../app/ui/UITask.cpp>
extra_scripts =
  pre:../../scripts/pio_env_stamp.py
  ${Heltec_lora32_v3.extra_scripts}
lib_deps =
  ${Heltec_lora32_v3.lib_deps}
  adafruit/Adafruit SSD1306 @ 2.5.17
  densaugeo/base64 @ 1.4.0

; -----------------------------------------------------------------------------
; Faro — T-Deck MAX (Extended PSRAM/Contacts/Queue)
; -----------------------------------------------------------------------------
[env:faro_tdeck_max]
extends = env:faro_tdeck
build_unflags =
  ${env:faro_tdeck.build_unflags}
  -D MAX_CONTACTS=350
build_flags =
  ${env:faro_tdeck.build_flags}
  -D MAX_CONTACTS=500
  -D FARO_TDECK_MAX=1

