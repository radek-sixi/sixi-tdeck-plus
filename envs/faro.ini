; Faro — T-Beam S3 Supreme Headless Gateway (BLE + WiFi + GPS)
; -----------------------------------------------------------------------------
[env:faro_tbeam_supreme]
extends = T_Beam_S3_Supreme_SX1262
build_unflags =
