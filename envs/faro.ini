; -----------------------------------------------------------------------------
; Faro — Elecrow ThinkNode M9 (320x240 ST7789 + LR1110 + GPS)
; -----------------------------------------------------------------------------
[env:faro_thinknode_m9]
extends = ThinkNode_M9
build_unflags =
  ${faro_common.build_unflags}
build_flags =
  ${ThinkNode_M9.build_flags}
  ${faro_common.build_flags}
  -D FARO_RADIO_LR1110=1
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D OFFLINE_QUEUE_SIZE=256
  -D ENABLE_WIFI_INTERFACE
build_src_filter =
  ${ThinkNode_M9.build_src_filter}
  -<helpers/ui/ST7789Display.cpp>
  -<helpers/ui/OLEDDisplay.cpp>
  -<helpers/ui/OLEDDisplayFonts.cpp>
  +<helpers/esp32/*.cpp>
  +<helpers/wifi/*.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<helpers/ui/buzzer.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../../../app/>
extra_scripts =
  pre:../../scripts/pio_env_stamp.py
  ${ThinkNode_M9.extra_scripts}
lib_deps =
  ${ThinkNode_M9.lib_deps}
  adafruit/Adafruit ST7735 and ST7789 Library @ 1.11.0
  end2endzone/NonBlockingRTTTL @ 1.3.0
  densaugeo/base64 @ 1.4.0
  ${faro_common.lib_deps}
