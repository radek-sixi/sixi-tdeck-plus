build_flags =
  ${T_Beam_S3_Supreme_SX1262.build_flags}
  ${faro_common.build_flags}
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D OFFLINE_QUEUE_SIZE=256
  -D ENABLE_WIFI_INTERFACE
  -D FARO_HEADLESS=1
build_src_filter =
  ${T_Beam_S3_Supreme_SX1262.build_src_filter}
  -<helpers/ui/SH1106Display.cpp>
  +<helpers/esp32/*.cpp>
  +<helpers/wifi/*.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../../../app/core/>
  +<../../../app/hal/>
  +<../../../app/platform/>
  +<../../../app/ui/UITask.cpp>
extra_scripts =
  pre:../../scripts/pio_env_stamp.py
