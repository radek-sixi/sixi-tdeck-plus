name: Release (firmware + Linux x86_64)

# Builds every release asset in CI from the tagged commit and the pinned public MeshCore submodule,
# packages them with scripts/package_release.sh (LICENSE, NOTICE, LICENSES/, THIRD_PARTY.md in every
# archive and the .deb; SHA256SUMS generated from the packaged files) and attaches them to a DRAFT
# GitHub release for the tag. Publish the draft by hand after checking it.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  FARO_EDITION_MARKERS: ${{ secrets.FARO_EDITION_MARKERS }}   # private marker list (check-edition.py)
  MESHCORE_URL: https://github.com/meshcore-dev/MeshCore.git
  PLATFORMIO_VERSION: "6.2.0"

jobs:
  gates:
    if: github.repository == 'radek-sixi/sixi-tdeck-plus'   # public repository only
    name: Edition and licence gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
          submodules: false
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
      - name: Tag matches the version scheme
        run: |
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] \
            || { echo "::error::tag ${GITHUB_REF_NAME} is not v<major>.<minor>.<patch>"; exit 1; }
      - name: Submodule is the public MeshCore upstream, pinned
        run: |
          url="$(git config -f .gitmodules submodule.external/MeshCore.url)"
          [ "$url" = "$MESHCORE_URL" ] || { echo "::error::external/MeshCore must point to $MESHCORE_URL (is: $url)"; exit 1; }
          git ls-tree HEAD external/MeshCore | grep -q '^160000 commit ' \
            || { echo "::error::external/MeshCore has no pinned gitlink"; exit 1; }
      - run: python3 scripts/check-edition.py --self-test
      - name: check-edition (tree + full git history)
        env:
          FARO_EDITION_MARKERS: ${{ secrets.FARO_EDITION_MARKERS }}
          FARO_EDITION_EXTRA_MARKERS: ${{ secrets.FARO_EDITION_EXTRA_MARKERS }}
        run: python3 scripts/check-edition.py .
      - run: scripts/license_audit.sh

  firmware:
    if: github.repository == 'radek-sixi/sixi-tdeck-plus'   # public repository only
    name: Firmware ${{ matrix.env }}
    needs: gates
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        env:
          - faro_tdeck
          - faro_tdeck_max
          - faro_heltec_v3
          - faro_tbeam_supreme
          - faro_thinknode_m9
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          submodules: true
      - name: Submodule is the public MeshCore upstream
        id: sub
        run: |
          url="$(git -C external/MeshCore remote get-url origin)"
          [ "$url" = "$MESHCORE_URL" ] || { echo "::error::external/MeshCore was cloned from $url"; exit 1; }
          echo "sha=$(git -C external/MeshCore rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
      - name: Cache PlatformIO packages and libraries
        uses: actions/cache@v4.2.3
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
            external/MeshCore/.pio/libdeps
          key: pio-${{ runner.os }}-${{ env.PLATFORMIO_VERSION }}-${{ matrix.env }}-${{ steps.sub.outputs.sha }}-${{ hashFiles('envs/*.ini') }}
          restore-keys: |
            pio-${{ runner.os }}-${{ env.PLATFORMIO_VERSION }}-${{ matrix.env }}-
      - name: Install PlatformIO
        run: pip install "platformio==${PLATFORMIO_VERSION}"
      - name: Build ${{ matrix.env }}
        run: |
          scripts/link_env.sh
          pio run -d external/MeshCore -e "${{ matrix.env }}"
      - name: Licence audit of the linked libraries
        run: FARO_AUDIT_ENVS="${{ matrix.env }}" scripts/license_audit.sh
      - name: Collect build outputs
        run: |
          B="external/MeshCore/.pio/build/${{ matrix.env }}"
          python3 scripts/check-edition.py --no-history "$B/firmware.bin" "$B/firmware.elf"
          mkdir -p "out/${{ matrix.env }}"
          cp "$B/firmware.bin" "$B/bootloader.bin" "$B/partitions.bin" "out/${{ matrix.env }}/"
          if [ -f "$B/firmware-merged.bin" ]; then cp "$B/firmware-merged.bin" "out/${{ matrix.env }}/"; fi
          cp ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin "out/${{ matrix.env }}/"
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: fw-${{ matrix.env }}
          path: out/
          if-no-files-found: error
          retention-days: 7

  host:
    if: github.repository == 'radek-sixi/sixi-tdeck-plus'   # public repository only
    name: Linux x86_64 desktop build
    needs: gates
    runs-on: ubuntu-24.04
    env:
      SDL_VIDEODRIVER: dummy
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          submodules: true
      - name: Install SDL2, PNG and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libsdl2-dev libpng-dev unifdef
      - name: Configure, build and test
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            "-DCMAKE_C_FLAGS=-Wall -Wextra" "-DCMAKE_CXX_FLAGS=-Wall -Wextra"
          cmake --build build
          ctest --test-dir build --output-on-failure
      - name: Collect binaries
        run: |
          mkdir -p host-out
          cp build/faro-sim build/faro-console host-out/
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: host-linux-x86_64
          path: host-out/
          if-no-files-found: error
          retention-days: 7

  release:
    if: github.repository == 'radek-sixi/sixi-tdeck-plus'   # public repository only
    name: Package and upload
    needs: [firmware, host]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          submodules: true
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4.3.0
        with:
          pattern: fw-*
          path: pio-build
          merge-multiple: true
      - uses: actions/download-artifact@v4.3.0
        with:
          name: host-linux-x86_64
          path: host-build
      - name: Package
        run: |
          chmod 0755 host-build/*
          FARO_PIO_BUILD="$PWD/pio-build" FARO_HOST_BUILD="$PWD/host-build" FARO_DIST_DIR="$PWD/dist" \
            scripts/package_release.sh "${GITHUB_REF_NAME#v}"
      - name: Verify SHA256SUMS
        working-directory: dist
        run: sha256sum -c SHA256SUMS
      - name: Create draft release with all assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --draft --verify-tag \
            --title "Faro ${GITHUB_REF_NAME}" \
            --notes "Built by CI from ${GITHUB_SHA}. Verify downloads with: sha256sum -c SHA256SUMS. Licences: NOTICE, THIRD_PARTY.md; full texts in LICENSES/ inside each archive."
